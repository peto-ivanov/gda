[tool.poetry]
name = "gda"
version = "0.1.0"
description = "Data Science Studies Project"
authors = ["Peter Ivanov <peto.ivanov@pm.me>"]
readme = "README.md"
package-mode = false

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"
seaborn = "^0.13.2"
scikit-learn = "^1.6.0"
scipy = "^1.15.1"
statsmodels = "^0.14.4"
matplotlib = "^3.10.0"
datasets = "^3.4.1"
transformers = {extras = ["torch"], version = "^4.49.0"}
sagemaker = "^2.242.0"
torch = {version = "^2.6.0", source = "pytorch"}
torchvision = {version = "^0.21.0", source = "pytorch"}
torchaudio = {version = "^2.6.0", source = "pytorch"}
boto3 = "^1.37.16"
pydantic-settings = "^2.8.1"


[tool.poetry.group.dev.dependencies]
ipython = "^8.31.0"
ipykernel = "^6.29.5"
ipywidgets = "^8.1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
